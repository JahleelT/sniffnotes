name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch cancels the older run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  checks:
    name: Lint, type-check, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # The build makes no Supabase calls, so placeholders are enough; real values live in Vercel.
      NEXT_PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder
      SUPABASE_SECRET_KEY: ci-placeholder
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type-check
        run: npm run typecheck

      - name: Unit and data tests
        run: npm test

      - name: Generated data matches its CSV sources
        run: npm run check:data

      - name: Known vulnerabilities in production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Build
        run: npm run build

  migrate:
    name: Apply database migrations
    # Only after checks pass on main. `supabase db push` applies just the migrations the database
    # hasn't run yet, so this is a no-op when nothing in supabase/migrations changed.
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Push migrations to Supabase
        env:
          # Use the Session pooler connection string from Supabase (Connect → Session pooler):
          # GitHub's runners can't reach the IPv6-only direct connection.
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          if [ -z "$SUPABASE_DB_URL" ]; then
            echo "::notice::SUPABASE_DB_URL secret isn't set, so migrations were skipped. See README → CI/CD."
            exit 0
          fi
          yes | npx supabase db push --db-url "$SUPABASE_DB_URL"
